name: Build Sliding Tasks Mobile APK

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-mobile-apk.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and upload mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Run unit tests and assemble debug APK
        working-directory: apps/mobile
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: sliding-tasks-mobile-debug-apk
          path: apps/mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
