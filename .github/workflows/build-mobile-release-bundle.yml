name: Build signed Sliding Tasks release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
      - name: Build and verify signed bundle
        working-directory: apps/mobile
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.SLIDING_TASKS_UPLOAD_KEYSTORE_BASE64 }}
          SLIDING_TASKS_UPLOAD_STORE_PASSWORD: ${{ secrets.SLIDING_TASKS_UPLOAD_STORE_PASSWORD }}
          SLIDING_TASKS_UPLOAD_KEY_PASSWORD: ${{ secrets.SLIDING_TASKS_UPLOAD_KEY_PASSWORD }}
          SLIDING_TASKS_UPLOAD_KEY_ALIAS: sliding-tasks-upload
        run: |
          set -euo pipefail
          : "${UPLOAD_KEYSTORE_BASE64:?missing upload keystore secret}"
          : "${SLIDING_TASKS_UPLOAD_STORE_PASSWORD:?missing store password secret}"
          : "${SLIDING_TASKS_UPLOAD_KEY_PASSWORD:?missing key password secret}"
          export SLIDING_TASKS_UPLOAD_KEYSTORE="$RUNNER_TEMP/sliding-tasks-upload.p12"
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$SLIDING_TASKS_UPLOAD_KEYSTORE"
          trap 'rm -f "$SLIDING_TASKS_UPLOAD_KEYSTORE"' EXIT
          ./gradlew --no-daemon testDebugUnitTest verifyReleaseWithoutCrashlytics bundleRelease
          bundle=app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          jarsigner -verify "$bundle"
          sha256sum "$bundle" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: sliding-tasks-release-aab
          path: apps/mobile/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
