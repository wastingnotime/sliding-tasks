name: Build Sliding Tasks site image

on:
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/build-site-image.yml"
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/build-site-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - name: Build site image
        uses: docker/build-push-action@v7
        with:
          context: apps/site
          file: apps/site/Dockerfile
          push: false
          tags: sliding-tasks-site:ci

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::590183855481:role/github-actions-sliding-tasks-publisher
          role-session-name: sliding-tasks-site-publish
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        name: Publish immutable candidate image
        uses: docker/build-push-action@v7
        with:
          context: apps/site
          file: apps/site/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sliding-tasks-site:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/wastingnotime/sliding-tasks
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record promotion input
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Candidate: ${REGISTRY}/sliding-tasks-site@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
