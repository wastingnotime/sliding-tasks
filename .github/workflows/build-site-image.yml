name: Build Sliding Tasks site image

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "sandboxes/integration/**"
      - ".github/workflows/build-site-image.yml"
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "sandboxes/integration/**"
      - ".github/workflows/build-site-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build site image
        uses: docker/build-push-action@v7
        with:
          context: apps/site
          file: apps/site/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: sliding-tasks-site:ci

      - name: Validate built site image
        run: |
          set -euo pipefail
          docker run -d --name site-validation -p 127.0.0.1:18085:80 sliding-tasks-site:ci
          trap 'docker rm -f site-validation' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:18085/health/ready && break
            sleep 1
          done
          python3 sandboxes/integration/validate_site.py
      - uses: actions/upload-artifact@v7
        with:
          name: sliding-tasks-site-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: site-validation.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Require infra intake credential
        env:
          GH_TOKEN: ${{ secrets.INFRA_PLATFORM_PROMOTION_TOKEN }}
        run: ': "${GH_TOKEN:?missing INFRA_PLATFORM_PROMOTION_TOKEN}"'
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: sliding-tasks-site-validation-${{ github.sha }}-${{ github.run_attempt }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::590183855481:role/github-actions-sliding-tasks-publisher
          role-session-name: sliding-tasks-site-publish
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        name: Publish immutable candidate image
        uses: docker/build-push-action@v7
        with:
          context: apps/site
          file: apps/site/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sliding-tasks-site:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/wastingnotime/sliding-tasks
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate published immutable candidate
        env:
          IMAGE_REFERENCE: ${{ steps.ecr.outputs.registry }}/sliding-tasks-site@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REFERENCE"
          docker run -d --name candidate-validation -p 127.0.0.1:18085:80 "$IMAGE_REFERENCE"
          trap 'docker rm -f candidate-validation' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:18085/health/ready && break
            sleep 1
          done
          python3 sandboxes/integration/validate_site.py
      - name: Record promotion input
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Candidate: ${REGISTRY}/sliding-tasks-site@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
      - name: Write candidate handoff
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ['DIGEST'])
          handoff = {
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'source_revision': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'image_reference': f"{os.environ['REGISTRY']}/sliding-tasks-site@{os.environ['DIGEST']}",
              'platforms': ['linux/amd64', 'linux/arm64'],
              'validation': json.loads(Path('site-validation.json').read_text()),
              'release_notes_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/commit/{os.environ['GITHUB_SHA']}",
          }
          Path('sliding-tasks-site-handoff.json').write_text(json.dumps(handoff, indent=2) + '\n')
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: sliding-tasks-site-handoff-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            sliding-tasks-site-handoff.json
            site-validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch candidate to infra-platform intake
        env:
          GH_TOKEN: ${{ secrets.INFRA_PLATFORM_PROMOTION_TOKEN }}
        run: |
          gh api --method POST \
            repos/wastingnotime/infra-platform/actions/workflows/sliding-tasks-site-promotion.yml/dispatches \
            -f ref=main -f "inputs[run_id]=$GITHUB_RUN_ID"
