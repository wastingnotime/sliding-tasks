server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health/live {
        default_type text/plain;
        return 200 "live\n";
    }

    location = /health/ready {
        default_type text/plain;
        return 200 "ready\n";
    }

    location = /sliding-tasks {
        return 308 /sliding-tasks/;
    }

    location ^~ /sliding-tasks/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
